name = "oasis-scout"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serve the static PWA assets from the dist folder
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
DEFAULT_CITY = "Palm Springs"
DEFAULT_STATE = "CA"
